<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panpibara</title>
    <style>
        body { font-family: Georgia, serif; margin: 0; padding: 0; text-align: center; background-color: #C9A697;padding-bottom: 200px;}
        header { background: #6A3F37; color: white; padding: 20px; font-size: 30px;}
        .productos { 
            display: flex; 
            justify-content: center;
            flex-wrap: wrap; 
        }
        .producto {  
            margin: 10px; 
            padding: 20px; /* Reducimos el padding */
            width: 300px; /* Ajustamos el ancho */
            
            display: flex;
            flex-direction: column;
            align-items: center; /* Centra horizontalmente el contenido */
            text-align: center;
        }
        .producto img { 
            width: 400px; /* La imagen ocupará el 100% del ancho del contenedor */
            height: auto; /* Mantiene la proporción */
            object-fit: cover; /* Evita que la imagen se distorsione */
        }
        .producto h3{
            background-color: #F0A98B;
            background-size: 100%;
            margin-top: -28%;
            padding-left: 80px;
            padding-right: 80px;
        }
        img { 
            width: 110%; 
            align-content: center; }
        footer { 
            background: #333; 
            color: white; 
            padding: 10px; 
            margin-top: 20px;
            bottom: 0; 
            width: 100%;
            position: absolute; 
            background-color: #5B3221;
            text-align: left;}
        .footer {
            background-color: #6A3F37;
            color: white;
            display: flex;
            justify-content: space-around;
            padding: 20px;
            position: fixed;
        }
        .footer div {
            flex: 1;
        }
        .footer h3 {
            margin-bottom: 10px;
            font-size: 16px;
            line-height: 5;
            margin-left: 1cm;
        }
        .footer a {
            color: white;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
            margin-left: 1cm;
        }
        .logo {
            text-align: center;
        }
        
        .ubicacion {
            margin-top: 60px;
        }
        .ubicacion h2 {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .ubicacion h2:before,
        .ubicacion h2:after {
            content: "";
            flex: 1;
            border-bottom: 2px solid #5a3a2c;
            margin: 0 10px;
        }
        .direccion {
            font-size: 30px;
            display: flex;
            align-items: center; /* Alinea verticalmente */
            justify-content: center; /* Centra horizontalmente */
            padding: 40px;margin-top: -100px;
        }
        
        
        
    </style>
</head>
<body>
    <header>
        Bienvenidos a Panpibara
    </header>

    <div class="ubicacion">
        <h2>Explora nuestras categorías</h2>
    </div>

    <section class="productos">
        <div class="producto" >
            <img src="Imagenes/PanesMenu.png" alt="Panes">
            <h3>Panadería</h3>
            
        </div>
        <div class="producto">
            <img src="Imagenes/CafeMenu.png" alt="Cafe">
            <h3>Café</h3>
            
        </div>
        <div class="producto">
            <img src="Imagenes/EnsaladaMenu.png" alt="Ensalada">
            <h3>Platillos</h3>
            
        </div>
    </section>
    
    <div class="ubicacion">
        <h2>Ubicación</h2>
        <div class="direccion">
            <p>VENTURA PUENTE 1044<br>Tel. (443) 315 5996</p>
            
            <img src="Imagenes/Mapa.png" alt="Mapa de ubicación" style="width: 800px;">
        </div>
        
    </div>

    

    <footer class="footer">
        <div>
            <h3>POLÍTICAS</h3>
            <a href="chi">Términos y Condiciones</a>
            <a href="chi">Aviso de Privacidad</a>
            <a href="chi">Devoluciones y Reembolsos</a>
        </div>
        <div>
            <h3>SOBRE NOSOTROS</h3>
            <a href="chi">Bolsa de trabajo</a>
            <a href="chi">¿Quiénes somos?</a>
        </div>
        <div class="logo">
            <img src="Imagenes/footer.png" alt="Panpibara Logo" style="height: 190px; width: 200px;">
            
        </div>
    </footer>
</body>




</html>
