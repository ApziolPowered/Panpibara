<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #5a3d31;
            color: #5a3d31;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('imagenes/fondo.png') no-repeat center center/cover;
            opacity: 0.3;
            z-index: -1;
        }

        .login-container {
            position: relative;
            color: white;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .login-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            z-index: 1;
        }

        .login-container * {
            position: relative;
            z-index: 2;
        }

        .login-container h2 {
            margin-bottom: 20px;
            font-size: 24px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }

        input {
            display: block;
            width: calc(100% - 20px);
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #F0A98B;
            border-radius: 5px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.8);
            color: #5a3d31;
        }

        button {
            background-color: #F0A98B;
            color: white;
            border: none;
            padding: 12px;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #e08975;
        }

        .link {
            color: #FFD4C2;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: underline;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fff;
            border-radius: 10px;
            padding: 30px;
            width: 350px;
            position: relative;
            font-family: 'Georgia', serif;
        }

        .modal-content h2 {
            margin-top: 0;
            font-size: 22px;
            color: #5a3d31;
        }

        .modal-content input, .modal-content button {
            margin-top: 10px;
        }

        .close {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #5a3d31;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <form method="post" action="Conexion.php">
        <div class="login-container">
            <h2>Inicio de sesión</h2>
            <img src="Imagenes/footer.png" alt="Logogin" style="width: 200px;">
            <input type="text" name="txtusername" placeholder="Usuario" required>
            <input type="password" name="txtpassword" placeholder="Contraseña" required>
            <button type="submit">Ingresar</button><br><br>
            <button type="button" onclick="mostrarRegistro()">Registrarse</button>
            <div class="link" onclick="mostrarRecuperacion()">¿Olvidaste tu contraseña?</div>
        </div>
    </form>

    <!-- Modal de Registro -->
    <div id="modalRegistro" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarRegistro()">&times;</span>
            <h2>Registro de Usuario</h2>
            <form method="post" action="Registro.php">
                <input type="text" name="nombre" placeholder="Nombre completo" required>
                <input type="text" name="usuario" placeholder="Usuario" required>
                <input type="email" name="correo" placeholder="Correo electrónico" required>
                <input type="password" name="contraseña" placeholder="Contraseña" required>
                <button type="submit">Registrar</button>
            </form>
        </div>
    </div>

    <!-- Modal de Recuperación de Contraseña -->
    <div id="modalRecuperacion" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarRecuperacion()">&times;</span>
            <h2>Recuperar Contraseña</h2>
            <form method="post" action="Recuperar.php">
                <input type="email" name="correo_recuperacion" placeholder="Ingresa tu correo" required>
                <button type="submit">Enviar código</button>
            </form>
        </div>
    </div>

    <script>
        function mostrarRegistro() {
            document.getElementById('modalRegistro').style.display = 'flex';
        }

        function cerrarRegistro() {
            document.getElementById('modalRegistro').style.display = 'none';
        }

        function mostrarRecuperacion() {
            document.getElementById('modalRecuperacion').style.display = 'flex';
        }

        function cerrarRecuperacion() {
            document.getElementById('modalRecuperacion').style.display = 'none';
        }

        window.onclick = function(event) {
            const modalRegistro = document.getElementById('modalRegistro');
            const modalRecuperacion = document.getElementById('modalRecuperacion');
            if (event.target === modalRegistro) {
                modalRegistro.style.display = "none";
            }
            if (event.target === modalRecuperacion) {
                modalRecuperacion.style.display = "none";
            }
        }
    </script>
</body>
</html>
